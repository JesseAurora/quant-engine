[package]
name = "quant-core"
version = "0.1.0"
edition = "2021"

[dependencies]
quant-common = { path = "../quant-common" }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal"] }
rust_decimal = { version = "1.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4.35", features = ["serde"] }
thiserror = "2.0.21"
async-trait = "0.1"
dotenv = "0.15"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3"
log = "0.4.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.15.27"
[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "repository_bench"
harness = false
